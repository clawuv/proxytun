name: Build macOS

permissions:
  contents: read

on:
  push:
    branches: [ dev, main, master ]
  pull_request:
    branches: [ dev, main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable

    - name: Build ProxyTun app
      run: |
        xcodebuild \
          -project MacOS/ProxyTun/ProxyTun.xcodeproj \
          -scheme ProxyTun \
          -configuration Release \
          -derivedDataPath MacOS/ProxyTun/DerivedData \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY='' \
          build

    - name: Verify build outputs
      run: |
        ls -la MacOS/ProxyTun/DerivedData/Build/Products/Release/
        file MacOS/ProxyTun/DerivedData/Build/Products/Release/ProxyTun.app/Contents/MacOS/ProxyTun

    - name: Prepare app for packaging
      run: |
        mkdir -p MacOS/ProxyTun/output
        rm -rf MacOS/ProxyTun/output/ProxyTun.app
        cp -R MacOS/ProxyTun/DerivedData/Build/Products/Release/ProxyTun.app \
          MacOS/ProxyTun/output/ProxyTun.app

    - name: Build unsigned PKG
      run: |
        chmod +x MacOS/ProxyTun/build.sh
        cd MacOS/ProxyTun
        ./build.sh

    - name: Upload app artifact
      uses: actions/upload-artifact@v4
      with:
        name: ProxyTun-macOS-app
        path: MacOS/ProxyTun/output/ProxyTun.app
        retention-days: 30

    - name: Upload PKG artifact
      uses: actions/upload-artifact@v4
      with:
        name: ProxyTun-macOS-installer
        path: MacOS/ProxyTun/output/ProxyTun-*.pkg
        retention-days: 30
