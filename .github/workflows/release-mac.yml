name: Release macOS

permissions:
  contents: write

on:
  push:
    tags:
    - 'v*'
  workflow_dispatch:

jobs:
  release:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable

    - name: Build ProxyTun app
      run: |
        xcodebuild \
          -project MacOS/ProxyTun/ProxyTun.xcodeproj \
          -scheme ProxyTun \
          -configuration Release \
          -derivedDataPath MacOS/ProxyTun/DerivedData \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY='' \
          build

    - name: Prepare app for packaging
      run: |
        mkdir -p MacOS/ProxyTun/output
        rm -rf MacOS/ProxyTun/output/ProxyTun.app
        cp -R MacOS/ProxyTun/DerivedData/Build/Products/Release/ProxyTun.app \
          MacOS/ProxyTun/output/ProxyTun.app

    - name: Build PKG installer
      run: |
        chmod +x MacOS/ProxyTun/build.sh
        cd MacOS/ProxyTun
        ./build.sh

    - name: Upload release assets
      uses: softprops/action-gh-release@v2
      with:
        files: |
          MacOS/ProxyTun/output/ProxyTun-v*-Universal-Installer.pkg
        generate_release_notes: true

    - name: Upload workflow artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ProxyTun-macOS-release
        path: |
          MacOS/ProxyTun/output/ProxyTun.app
          MacOS/ProxyTun/output/ProxyTun-v*-Universal-Installer.pkg
        retention-days: 30
